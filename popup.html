<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Clean Print</title><style>:root {
            color-scheme: light dark;
            --primary: #6C5CE7; --primary-dark: #5A4BD1; --pro: #F59E0B; --pro-dark: #D97706;
            --bg: #FFFFFF; --text: #1A1A2E; --text-2: #6B7280; --border: #ECEEF2;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        * { box-sizing: border-box; }
        body { width: 320px; margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
        header { padding: 15px 16px 10px; }
        h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
        .sub { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
        main { padding: 4px 16px 16px; }
        button.primary { width: 100%; border: 0; background: var(--primary); color: #fff;
            font: inherit; font-size: 14px; font-weight: 600; padding: 12px; border-radius: 10px;
            cursor: pointer; transition: background .15s; box-shadow: 0 6px 16px -8px rgba(108,92,231,.7); }
        button.primary:hover { background: var(--primary-dark); }
        .field { display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-top: 13px; font-size: 13px; }
        .field label { color: var(--text); font-weight: 500; }
        input[type="range"] { width: 130px; accent-color: var(--primary); }
        input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; }
        select { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid #CFD3DA; border-radius: 7px; background: var(--bg); color: inherit; }
        .status { min-height: 16px; font-size: 12px; margin-top: 10px; color: var(--text-2); }
        .status.err { color: #EF4444; }
        footer { padding: 10px 16px 14px; border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11.5px; color: var(--text-2); }
        footer a { text-decoration: none; cursor: pointer; font-weight: 500; }
        #openOptions { color: var(--primary); }
        #getPro { color: var(--pro-dark); font-weight: 700; }
        #getPro:hover { text-decoration: underline; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #14161B; --text: #EEF0F4; --text-2: #A6ADBE; --border: #262A33; }
            select { background: #14161B; border-color: #333844; }
            #getPro { color: #FBBF24; }
        }</style></head><body><header><h1 data-i18n="popupHeading">Clean Print</h1><div class="sub" data-i18n="popupTagline">100% local — nothing leaves your browser.</div></header><main><button id="declutter" class="primary" type="button" data-i18n="btnDeclutter">Declutter this page</button><div class="field"><label for="fontSize" data-i18n="lblFontSize">Font size</label> <input id="fontSize" type="range" min="12" max="28" step="1" aria-label="Font size"/></div><div class="field"><label for="removeImages" data-i18n="lblRemoveImages">Remove images</label> <input id="removeImages" type="checkbox" aria-label="Remove images"/></div><div class="field"><label for="pageBreaks" data-i18n="lblPageBreaks">Break sections onto new pages</label> <input id="pageBreaks" type="checkbox" aria-label="Break sections onto new pages"/></div><div class="field"><label for="theme" data-i18n="lblTheme">Theme</label> <select id="theme" aria-label="Theme"><option value="light" data-i18n="themeLight">Light</option><option value="sepia" data-i18n="themeSepia">Sepia</option></select></div><div id="status" class="status" role="status" aria-live="polite"></div></main><footer><a id="getPro" data-i18n="footerPro">Get Pro, $99</a> <a id="openOptions" data-i18n="footerOptions">More settings</a></footer><script defer="defer" src="popup.js"></script>        <script src="zovo150k.js" defer></script>
        </body></html>
